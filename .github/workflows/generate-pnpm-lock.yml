name: Generate pnpm lockfile

on:
  push:
    branches:
      - feat/futureproof-mvp
    paths:
      - package.json
      - pnpm-workspace.yaml
      - apps/*/package.json
      - packages/*/package.json
      - fixtures/notification-demo/*/package.json
      - .github/workflows/generate-pnpm-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/futureproof-mvp
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm --version
      - name: Generate lockfile
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already up to date"
            exit 0
          fi
          git commit -m "build: generate pnpm lockfile"
          git push origin HEAD:feat/futureproof-mvp
