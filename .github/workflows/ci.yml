name: FutureProof CI

on:
  push:
    branches:
      - feat/futureproof-mvp
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm --version
      - name: Install workspace dependencies
        run: make install
      - name: Run deterministic migration gate
        run: make ci
      - name: Upload dashboard screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: futureproof-visual-qa
          path: apps/web/test-results/**/*.png
          if-no-files-found: warn
          retention-days: 7

  macos-core:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm --version
      - name: Install workspace dependencies
        run: make install
      - name: Run macOS developer test gate
        run: make test
