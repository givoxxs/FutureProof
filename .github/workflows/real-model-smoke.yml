name: FutureProof Real Model Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REQUIRE_REAL_MODEL: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'deepseek/deepseek-v4-flash-0731' }}
      OPENROUTER_BASE_URL: ${{ vars.OPENROUTER_BASE_URL || 'https://openrouter.ai/api/v1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Enable pnpm 11.4.0
        run: |
          corepack enable
          corepack prepare pnpm@11.4.0 --activate
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Run real-model JSON smoke
        run: pnpm run smoke:real-model
